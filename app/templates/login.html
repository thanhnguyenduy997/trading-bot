{% extends "base.html" %}
{% block content %}
<section class="card auth-card">
    <h1>Login</h1>
    <p>Sign in to manage trading accounts.</p>
    <form action="/api/auth/login" method="post" class="stack">
        <label>Email</label>
        <input type="email" name="email" required>
        <label>Password</label>
        <input type="password" name="password" required>
        <button type="submit">Login</button>
    </form>
</section>
{% endblock %}
